
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>BioGuard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #e8f5e9;
      text-align: center;
      margin: 0;
      color: #234b32;
    }
    header {
      background: #2e7d32;
      color: white;
      padding: 35px 15px;
    }
    main { padding: 25px; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin: 15px auto;
      max-width: 450px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🌿 BioGuard</h1>
    <p>Protect Nature. Preserve Biodiversity.</p>
  </header>

  <main>
    <h2>Welcome to BioGuard</h2>
    <p>Learn about endangered species
       and protect our ecosystems.</p>

    <div class="card">
      <h3>🐘 Endangered Species</h3>
      <p>Discover animals that need protection.</p>
    </div>

    <div class="card">
      <h3>🌳 Ecosystem Conservation</h3>
      <p>Learn how to protect natural habitats.</p>
    </div>
  </main>
</body>
</html>
